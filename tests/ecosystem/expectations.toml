status_windows = "skip"
reason_windows = "no upstream Windows support — uvloop publishes no Windows wheels (libuv loop is POSIX-only there by design)."
notes = "measured 2026-08 (RFC 0072 WS3): policy install, gather fan-out, loopback TCP echo through uvloop transports, UDP datagram endpoint round-trip, loop.getaddrinfo, run_in_executor, subprocess_exec. Landed on the way: PyImport_ImportModuleLevelObject returns the root package for empty-fromlist dotted imports (Cython's __Pyx_ImportDottedModule binds `asyncio`, not the leaf), PyContext_CopyCurrent/Enter/Exit bridged to contextvars (uvloop runs every callback under a copied context), PyOS_setsig/PyThread_get_thread_ident/PyDescr_IsData and the fork hooks, a faithful C-visible exception tail on identity boxes (PyBaseExceptionObject fields at ABI offsets; Cython fetches StopIteration.value with a direct struct read), value-preserving tp_iternext bridges + PyIter_Send (the swallowing PyIter_Next lane made every compiled await of a VM awaitable complete with None), and PySet_Discard's found/not-found return contract (Cython's set.remove raised KeyError for every uvloop timer cancellation)."

[packages.psycopg]
status = "pass"
notes = "measured 2026-08 (RFC 0072 WS4): serverless but behavior-asserting — pq.__impl__ == 'binary' (the Cython/libpq wheel is the live implementation), SQL composition, Transformer dumper/loader round-trips, conninfo parse/build, and a real libpq connect driven to OperationalError against a closed loopback port. Landed on the way: PyOS_double_to_string (psycopg's FloatDumper renders every float parameter through it; the missing symbol was a NULL jump). One cosmetic divergence: the failed-connect cleanup prints an ignored finalizer AttributeError to stderr that CPython formats as 'Exception ignored in'."

[packages.grpcio]
status = "fail"
reason = "measured 2026-08 (RFC 0072 WS4 stretch): import + channel/server construction + insecure port bind succeed, but the cygrpc server poller thread dies as soon as an RPC arrives (Exception in thread _serve with an empty traceback; the client then reports StatusCode.CANCELLED). The C++ core's completion-queue threading model needs deeper thread-state work than this wave scopes; the row stays measured-fail per the RFC."
