[package]
name = "weavepy-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
description = "WeavePy C-API bridge: a CPython-3.13-compatible C-API surface for native extension modules."

[lints]
workspace = true

[features]
default = []

[dependencies]
weavepy-vm      = { workspace = true }
weavepy-compiler = { workspace = true }
libc            = { workspace = true }
# RFC 0069 WS5 — C-stack headroom probe for the C-API recursion guard.
stacker         = "0.1.24"
libloading      = { workspace = true }
num-bigint      = { workspace = true }
num-traits      = { workspace = true }
thiserror       = { workspace = true }

# RFC 0064 WS2 — the Windows extension loader calls `LoadLibraryExW`
# directly (CPython's dynload_win.c flag set + `GetLastError` for the
# CPython-shaped ImportError message).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
weavepy   = { workspace = true }
tempfile  = "3"
