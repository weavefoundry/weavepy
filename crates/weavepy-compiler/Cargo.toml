[package]
name = "weavepy-compiler"
description = "Compiles a WeavePy AST to WeavePy bytecode."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
weavepy-lexer  = { workspace = true }
weavepy-parser = { workspace = true }
indexmap       = { workspace = true }
thiserror      = { workspace = true }

# RFC 0019 — numerics and serialization.
num-bigint     = { workspace = true }
# RFC 0068 WS1 — the AST optimizer's exact constant arithmetic
# (floor div/mod, IEEE conversions) over big ints.
num-integer    = { workspace = true }
num-traits     = { workspace = true }

[lints]
workspace = true
