name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test` compiles weavepy-pylib's source into a unit-test
      # harness but never emits the cdylib artifact, so build it
      # explicitly: the windows_dll integration battery (RFC 0064 WS5)
      # needs target/debug/python313.dll next to the shim exe.
      - run: cargo build -p weavepy-pylib
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --workspace --doc

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          msrv=$(grep -E '^rust-version' Cargo.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  regrtest:
    name: regrtest (blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Bundled regrtests are required to pass (see RFC 0026). The
    # runner gates on `tests/regrtest/expectations.toml` by default, so
    # any divergence — pass → fail, fail → pass — fails the job. Pull
    # requests update both the test and the baseline in the same
    # commit.
    #
    # The windows leg is advisory via the baseline's `measured_os`
    # stamp (RFC 0063 WS7), not via CI config: the runner prints the
    # full report, uploads the measured artifact below, and exits 0 on
    # unexpected results until a measured Windows baseline is
    # transplanted and "windows" joins the stamp.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build weavepy CLI + runtime library
        # weavepy-pylib builds python313.dll — on Windows the exe is a
        # thin shim over it (RFC 0064 WS1), so the DLL must sit next to
        # the exe. Building it on all three OSes keeps the cdylib
        # honest everywhere.
        run: cargo build --release -p weavepy-cli -p weavepy-pylib
      - name: Run bundled regrtests (subprocess, parallel)
        shell: bash
        run: |
          cargo run --release -p weavepy-cli -- regrtest \
            --mode subprocess \
            --workers 4 \
            --timeout 60
      - name: Append regrtest report to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WeavePy regrtest"
            echo
            cat target/regrtest/regrtest.md || echo "(no report produced)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regrtest-report-${{ matrix.os }}
          path: target/regrtest/
          if-no-files-found: warn

  bench:
    name: bench gate (blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # RFC 0058 — the benchmark lane. Gates on WeavePy/CPython *ratios*
    # against the per-platform baselines/bench-{os}-{arch}.json (RFC
    # 0062 WS3; host-independent, unlike absolute times); the 25%
    # threshold absorbs shared-runner noise. The markdown report lands
    # in the job summary so every PR shows its ratio table.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build weavepy CLI + runtime library + bench harness
        # weavepy-pylib: python313.dll, the runtime the Windows shim
        # exe loads (RFC 0064 WS1).
        run: cargo build --release -p weavepy-cli -p weavepy-pylib -p weavepy-bench
      - name: Run bench gate
        # Linux and Windows have no committed per-platform baseline
        # yet, so the gate is advisory there (--allow-missing-baseline
        # prints a note and exits 0). Each leg graduates to strict once
        # its measured bench-{os}-x86_64.json is committed — drop the
        # flag for that OS then (RFC 0062 for linux, RFC 0063 for
        # windows). macOS gates strictly against bench-macos-aarch64.json.
        shell: bash
        run: |
          target/release/weavepy-bench gate --pct=25 \
            --weavepy=target/release/weavepy \
            ${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && '--allow-missing-baseline' || '' }} \
            | tee bench-report.md
      - name: Append bench report to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WeavePy bench"
            echo
            cat bench-report.md || echo "(no report produced)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-${{ matrix.os }}
          path: bench-report.md
          if-no-files-found: warn

  ecosystem:
    name: ecosystem (blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # RFC 0062 WS3 — the ecosystem lane in CI. Installs the manifest's
    # packages from an offline wheel cache into venvs running under the
    # built weavepy, runs each row's probe (and package self-tests),
    # and gates on tests/ecosystem/expectations.toml. Blocking, same
    # policy as regrtest. The host CPython is only used by the wheel
    # fetcher (pip download needs a real Python); the runners' system
    # cc covers source builds.
    #
    # The windows leg is advisory via the baseline's `measured_os`
    # stamp (RFC 0063 WS7), not via CI config — see the regrtest job.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache ecosystem wheels
        uses: actions/cache@v4
        with:
          path: target/ecosystem-wheels
          key: ecosystem-wheels-${{ runner.os }}-${{ hashFiles('tests/ecosystem/manifest.toml') }}
      - name: Build weavepy CLI + runtime library
        # weavepy-pylib: python313.dll, the runtime the Windows shim
        # exe loads (RFC 0064 WS1).
        run: cargo build --release -p weavepy-cli -p weavepy-pylib
      - name: Fetch ecosystem wheels (no-op on cache hit)
        # `python`, not `python3`: setup-python exposes both on
        # ubuntu/macos (same 3.13 interpreter) but only `python` on
        # windows runners.
        run: python tools/ecosystem_fetch.py --dest target/ecosystem-wheels
      - name: Run ecosystem harness
        shell: bash
        run: |
          cargo run --release -p weavepy-conformance -- ecosystem \
            --wheels target/ecosystem-wheels \
            --selftests \
            --check

  dist-check:
    name: dist check (blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # RFC 0062 — builds the relocatable artifact from the release CLI
    # and runs `weavepy-dist check` against it (boot, stdlib, venv +
    # pip smoke). The pip leg reuses the offline wheel cache from the
    # ecosystem job's actions/cache key. On windows the builder emits
    # the RFC 0063 WS6 zip artifact / NT layout; the check command is
    # identical.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache ecosystem wheels
        uses: actions/cache@v4
        with:
          path: target/ecosystem-wheels
          key: ecosystem-wheels-${{ runner.os }}-${{ hashFiles('tests/ecosystem/manifest.toml') }}
      - name: Build weavepy CLI + runtime library
        # weavepy-pylib: python313.dll — the Windows artifact ships it
        # at the prefix root with libs\python313.lib (RFC 0064 WS3),
        # and the builder refuses to package a shim exe without it.
        run: cargo build --release -p weavepy-cli -p weavepy-pylib
      - name: Fetch ecosystem wheels (no-op on cache hit)
        # `python`, not `python3`: setup-python exposes both on
        # ubuntu/macos (same 3.13 interpreter) but only `python` on
        # windows runners.
        run: python tools/ecosystem_fetch.py --dest target/ecosystem-wheels
      - name: Run dist check
        shell: bash
        run: |
          cargo run --release -p weavepy-dist -- check \
            --wheels target/ecosystem-wheels

  conformance:
    name: cpython conformance (non-blocking)
    runs-on: ubuntu-latest
    # Still non-blocking — the wider CPython suite covers ~3000 tests
    # and the realistic match floor is still climbing. The regrtest
    # job above is the blocking signal; this job continues to run to
    # surface drift in the broader corpus without breaking PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify python oracle
        run: python3 -V
      - name: Run conformance harness
        run: cargo run --release -p weavepy-conformance -- run
      - name: Append report to job summary
        if: always()
        run: |
          {
            echo "## CPython conformance report"
            echo
            cat target/conformance/report.md || echo "(no report produced)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-report
          path: target/conformance/
          if-no-files-found: warn
