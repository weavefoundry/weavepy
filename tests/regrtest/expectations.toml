# Regrtest baseline.
#
# Each `[tests."<label>"]` entry records the *expected* status for one
# regression test. The label format is `bundled/<filename>` for the
# fixtures in this directory and `cpython/Lib/test/<filename>` for tests
# pulled from a checked-out `vendor/cpython/`.
#
# Status values mirror `regrtest::TestStatus`:
#   pass    — runs cleanly
#   fail    — uncaught exception escapes the script
#   error   — pre-execution failure (parse/compile/IO)
#   skip    — explicitly skipped (won't run; useful for "blocked on X")
#   timeout — exceeded the per-test budget
#
# Tests not listed below default to "expect pass".
#
# `--check` (the default) makes `weavepy-conformance regrtest` exit
# non-zero on any divergence from this file. CI uses that to block
# regressions; refresh the baseline with `--no-check` when intentionally
# changing expectations.
#
# RFC 0049 (conformance sweep wave 5) rewrote this file as a *measured
# whole-suite baseline*: discovery now covers every vendored
# `test_*.py` file and `test_*/` package, and every row below reflects
# an actual measured run (two cross-checked sweeps), not an aspiration.
#
# RFC 0051 (wave 6) re-measured the whole suite the same way after the
# verbatim-`typing` + core-language work: 13 labels flipped red→green
# (test_typing, test_type_params, test_type_aliases, test_genericalias,
# test_genericclass, test_super, test_scope, test_slice, test_index,
# test_dictviews, test_descrtut, test_dynamic, test_enumerate) with no
# regressions; a handful of correct-but-slow rows gained per-test
# budget headroom for parallel-sweep load.

