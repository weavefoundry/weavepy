timeout_seconds = 7200

[packages.lxml]
# Pinned to the selftest sdist (see the click row for the drift class).
requirements = "lxml==6.1.2"
probe = "probes/lxml_probe.py"

# RFC 0075 WS9: the lxml wheel ships no tests and the sdist cannot run
# in place (its unbuilt src/lxml would shadow the installed package —
# the numpy problem, except the suite *only* exists in the sdist).
# `overlay` grafts the sdist's test subtree onto a PYTHONPATH copy of
# the installed package, so `--pyargs lxml.tests` imports the real
