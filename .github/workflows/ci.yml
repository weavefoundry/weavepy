name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test` compiles weavepy-pylib's source into a unit-test
      # harness but never emits the cdylib artifact, so build it
      # explicitly: the windows_dll integration battery (RFC 0064 WS5)
      # needs target/debug/python313.dll next to the shim exe.
      - run: cargo build -p weavepy-pylib
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --workspace --doc

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          msrv=$(grep -E '^rust-version' Cargo.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  regrtest:
    name: regrtest (blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Bundled regrtests are required to pass (see RFC 0026). The
    # runner gates on `tests/regrtest/expectations.toml` by default, so
    # any divergence — pass → fail, fail → pass — fails the job. Pull
    # requests update both the test and the baseline in the same
    # commit.
    #
    # The windows leg is advisory via the baseline's `measured_os`
    # stamp (RFC 0063 WS7), not via CI config: the runner prints the
    # full report, uploads the measured artifact below, and exits 0 on
    # unexpected results until a measured Windows baseline is
    # transplanted and "windows" joins the stamp.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build weavepy CLI + runtime library
        # weavepy-pylib builds python313.dll — on Windows the exe is a
        # thin shim over it (RFC 0064 WS1), so the DLL must sit next to
        # the exe. Building it on all three OSes keeps the cdylib
        # honest everywhere.
        run: cargo build --release -p weavepy-cli -p weavepy-pylib
      - name: Run bundled regrtests (subprocess, parallel)
        shell: bash
        run: |
          cargo run --release -p weavepy-cli -- regrtest \
            --mode subprocess \
            --workers 4 \
            --timeout 60
      - name: Append regrtest report to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WeavePy regrtest"
            echo
            cat target/regrtest/regrtest.md || echo "(no report produced)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regrtest-report-${{ matrix.os }}
          path: target/regrtest/
          if-no-files-found: warn

  regrtest-gil0:
    name: regrtest -X gil=0 lane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # RFC 0076 WS12 — the free-threaded conformance lane. Every test is
    # spawned with `-X gil=0` and graded against the curated baseline in
    # tests/regrtest/expectations-gil0.toml (only the labels keyed there
    # are scheduled). Without the vendored CPython checkout the lane
    # degrades to its bundled rows, which is the blocking core; the
    # vendored thread-suite rows grade in local sweeps. The ubuntu leg
    # is advisory via the baseline's `measured_os` stamp until a
    # measured Linux baseline lands (RFC 0063 WS7).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build weavepy CLI + conformance harness
        run: cargo build --release -p weavepy-cli -p weavepy-conformance
      - name: Run free-threaded regrtest lane
        shell: bash
        run: |
          target/release/weavepy-conformance regrtest \
            --gil0 \
            --jobs 4 \
            --stream \
            --check
      - name: Append gil=0 lane report to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WeavePy regrtest (-X gil=0 lane)"
            echo
            cat target/conformance/regrtest.md || echo "(no report produced)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regrtest-gil0-report-${{ matrix.os }}
          path: target/conformance/
          if-no-files-found: warn

  bench:
    name: bench gate (blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # RFC 0058 — the benchmark lane.
    #
    # On PRs the blocking verdict is an *A/B comparison*: the
    # merge-base binary is built in a worktree and timed interleaved
    # with the PR binary on the same runner, gated on the PR/base
    # ratio at 15%. Machine skew cancels in that ratio, which is what
    # the old baseline gate spent its whole 25% envelope absorbing —
    # so this is both less flaky *and* more sensitive. The committed
    # per-platform baseline demotes to an advisory table plus a
    # blocking suite-geomean drift ratchet at 25% (many small
    # under-threshold regressions can't compound silently). A/B needs
    # no committed baseline, so Linux/Windows get a real blocking
    # gate too.
    #
    # On pushes (no merge-base to compare against) the gate falls
    # back to the committed-baseline comparison, advisory where no
    # baseline exists (RFC 0062 for linux, RFC 0063 for windows).
    steps:
      - uses: actions/checkout@v4
        with:
          # The A/B gate builds the merge-base commit; a shallow
          # clone can't resolve it.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build weavepy CLI + runtime library + bench harness
        # weavepy-pylib: python313.dll, the runtime the Windows shim
        # exe loads (RFC 0064 WS1).
        run: cargo build --release -p weavepy-cli -p weavepy-pylib -p weavepy-bench
      - name: Build merge-base weavepy (A/B reference)
        if: github.event_name == 'pull_request'
        # A separate worktree + target dir so the two builds never
        # thrash each other's incremental state; the shared
        # rust-cache still primes dependency compilation, and the
        # merge-base is usually a recent main commit CI has built
        # before, so this step is mostly cache hits.
        shell: bash
        run: |
          BASE_SHA=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "merge-base: $BASE_SHA"
          git worktree add ../weavepy-base "$BASE_SHA"
          cargo build --release -p weavepy-cli -p weavepy-pylib \
            --manifest-path ../weavepy-base/Cargo.toml \
            --target-dir ../weavepy-base/target
          BIN="$PWD/../weavepy-base/target/release/weavepy"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          echo "BASE_WEAVEPY=$BIN" >> "$GITHUB_ENV"
      - name: Run bench gate
        shell: bash
        run: |
          if [ -n "${BASE_WEAVEPY:-}" ]; then
            FLAGS="--base-weavepy=$BASE_WEAVEPY --pct=15 --baseline-pct=25"
          else
            FLAGS="--pct=25 ${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && '--allow-missing-baseline' || '' }}"
          fi
          target/release/weavepy-bench gate $FLAGS \
            --weavepy=target/release/weavepy \
            | tee bench-report.md
      - name: Append bench report to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WeavePy bench"
            echo
            cat bench-report.md || echo "(no report produced)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-${{ matrix.os }}
          path: bench-report.md
          if-no-files-found: warn

  ecosystem:
    name: ecosystem (blocking, ${{ matrix.os }}, shard ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3]
    # RFC 0062 WS3 — the ecosystem lane in CI. Installs the manifest's
    # packages from an offline wheel cache into venvs running under the
    # built weavepy, runs each row's probe (and package self-tests),
    # and gates on tests/ecosystem/expectations.toml. Blocking, same
    # policy as regrtest. The host CPython is only used by the wheel
    # fetcher (pip download needs a real Python); the runners' system
    # cc covers source builds.
    #
    # The lane fans out over three budget-balanced shards per OS
    # (`--shard K/3`): run serially, the RFC 0075 selftest tier (scipy
    # alone budgets 4 h) pushed the single job past 3 h wall. The
    # partition is deterministic from the manifest, so the three shard
    # verdicts together grade every row exactly once.
    #
    # The windows leg is advisory via the baseline's `measured_os`
    # stamp (RFC 0063 WS7), not via CI config — see the regrtest job.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache ecosystem wheels
        uses: actions/cache@v4
        with:
          path: target/ecosystem-wheels
          key: ecosystem-wheels-${{ runner.os }}-${{ hashFiles('tests/ecosystem/manifest.toml') }}
      - name: Build weavepy CLI + runtime library
        # weavepy-pylib: python313.dll, the runtime the Windows shim
        # exe loads (RFC 0064 WS1).
        run: cargo build --release -p weavepy-cli -p weavepy-pylib
      - name: Fetch ecosystem wheels (no-op on cache hit)
        # `python`, not `python3`: setup-python exposes both on
        # ubuntu/macos (same 3.13 interpreter) but only `python` on
        # windows runners.
        run: python tools/ecosystem_fetch.py --dest target/ecosystem-wheels
      - name: Run ecosystem harness
        shell: bash
        run: |
          cargo run --release -p weavepy-conformance -- ecosystem \
            --wheels target/ecosystem-wheels \
            --selftests \
            --shard ${{ matrix.shard }}/3 \
            --check
      # The job-log table truncates each row's failure reason to one cell;
      # ecosystem.json keeps the full text (faulthandler tracebacks, stage
      # markers), which is what a crash triage actually needs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-report-${{ matrix.os }}-shard${{ matrix.shard }}
          path: target/conformance/
          if-no-files-found: warn

  dist-check:
    name: dist check (blocking, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # RFC 0062 — builds the relocatable artifact from the release CLI
    # and runs `weavepy-dist check` against it (boot, stdlib, venv +
    # pip smoke). The pip leg reuses the offline wheel cache from the
    # ecosystem job's actions/cache key. On windows the builder emits
    # the RFC 0063 WS6 zip artifact / NT layout; the check command is
    # identical.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache ecosystem wheels
        uses: actions/cache@v4
        with:
          path: target/ecosystem-wheels
          key: ecosystem-wheels-${{ runner.os }}-${{ hashFiles('tests/ecosystem/manifest.toml') }}
      - name: Build weavepy CLI + runtime library
        # weavepy-pylib: python313.dll — the Windows artifact ships it
        # at the prefix root with libs\python313.lib (RFC 0064 WS3),
        # and the builder refuses to package a shim exe without it.
        run: cargo build --release -p weavepy-cli -p weavepy-pylib
      - name: Fetch ecosystem wheels (no-op on cache hit)
        # `python`, not `python3`: setup-python exposes both on
        # ubuntu/macos (same 3.13 interpreter) but only `python` on
        # windows runners.
        run: python tools/ecosystem_fetch.py --dest target/ecosystem-wheels
      - name: Run dist check
        shell: bash
        run: |
          cargo run --release -p weavepy-dist -- check \
            --wheels target/ecosystem-wheels

  conformance:
    name: cpython conformance (non-blocking)
    runs-on: ubuntu-latest
    # Still non-blocking — the wider CPython suite covers ~3000 tests
    # and the realistic match floor is still climbing. The regrtest
    # job above is the blocking signal; this job continues to run to
    # surface drift in the broader corpus without breaking PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify python oracle
        run: python3 -V
      - name: Run conformance harness
        run: cargo run --release -p weavepy-conformance -- run
      - name: Append report to job summary
        if: always()
        run: |
          {
            echo "## CPython conformance report"
            echo
            cat target/conformance/report.md || echo "(no report produced)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: target/conformance/
          if-no-files-found: warn
