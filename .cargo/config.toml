# Workspace-wide cargo config.
#
# Add target-specific build flags, alias commands, and registry settings here.
# Keep this file minimal; per-crate options belong in each crate's Cargo.toml.

[alias]
# Convenience aliases. Run with `cargo <alias>`.
xtest = "test --workspace --all-targets"
xcheck = "check --workspace --all-targets --all-features"
xclippy = "clippy --workspace --all-targets --all-features -- -D warnings"
xfmt = "fmt --all"
# RFC 0058 — the benchmark lane. Requires a release `weavepy` binary
# (`cargo build --release -p weavepy-cli`) next to the bench binary.
xbench = "run --release -p weavepy-bench --"

[build]
# Faster incremental builds for local dev. CI overrides via env if needed.
# rustflags = []

# Link the host targets through `scripts/link-ordered.sh`, which remaps the
# `weavepy` binary's symbol order file (crates/weavepy-cli/weavepy.order)
# onto the link's own symbols before running `cc` (see the script).
[target.x86_64-unknown-linux-gnu]
linker = "scripts/link-ordered.sh"

[target.x86_64-apple-darwin]
linker = "scripts/link-ordered.sh"

[target.aarch64-apple-darwin]
linker = "scripts/link-ordered.sh"
