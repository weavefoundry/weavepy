status = "pass"
notes = "measured 2026-08 (RFC 0075 WS7 burn): in-process server + GenericRpcHandler bytes-identity unary echo round-trips clean. The RFC 0072 red row's \"empty traceback in the _serve poller thread\" was not thread-state at all: cygrpc's poller slices a `bytes` completion tag through `PySequence_GetSlice`, whose list/tuple/str-only table raised a TypeError that Cython's nogil-adjacent except path swallowed to an empty traceback. `PySequence_GetSlice` now routes every object through the VM subscript dispatch (bytes/bytearray/memoryview, instance `__getitem__`, extension slot wrappers), with `_PyEval_SliceIndex`/`_PyEval_SliceIndexNotNone` landed alongside."
