# TEMPORARY (remove once read): times the attr_access bench fixture on the
# macOS arm64 runner for a handful of this branch's commits, to find the one
# after which the bench gate started reading it 10% to 20% over the merge
# base there (x86 and Linux arm64 builds of the same commits time alike).
name: tmp attr_access bisect (macOS arm64)

on:
  push:
    branches: [perf/native-to-python-calls]

jobs:
  bisect:
    name: attr_access by commit (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build each commit
        shell: bash
        env:
          RUSTFLAGS: --cap-lints warn
        run: |
          mkdir -p bins
          # oldest first: merge base, the last commit that read level,
          # the first that read high, and this push
          # (Each from a fresh worktree, the head too: a checkout older
          # than the shared target directory's libraries would be taken
          # for already built.)
          for sha in 5db22e15 be83162d 4369a2c9 "$GITHUB_SHA"; do
            git worktree add --detach ../w "$sha"
            cargo build --release -p weavepy-cli \
              --manifest-path ../w/Cargo.toml --target-dir ../w-target
            name="$sha"
            [ "$sha" = "$GITHUB_SHA" ] && name=head
            cp ../w-target/release/weavepy "bins/$name"
            git worktree remove --force ../w
          done
          ls -la bins
      - name: Time the fixture and its operations
        shell: bash
        run: |
          cat > attrops.py <<'EOF'
          import sys, time
          class Plain:
              def __init__(self):
                  self.a = 1; self.b = 2.0; self.c = "x"
              def tick(self):
                  self.a += 1
                  return self.a
          class Slotted:
              __slots__ = ("a", "b", "c")
              def __init__(self):
                  self.a = 1; self.b = 2.0; self.c = "x"
              def tick(self):
                  self.a += 1
                  return self.a
          def read_plain(n):
              p = Plain(); total = 0
              for _ in range(n): total += p.a
              return total
          def read_slot(n):
              s = Slotted(); total = 0
              for _ in range(n): total += s.a
              return total
          def read_both(n):
              p = Plain(); s = Slotted(); total = 0
              for _ in range(n): total += p.a + s.a
              return total
          def write_plain(n):
              p = Plain()
              for _ in range(n): p.b = p.b + 0.5
          def write_slot(n):
              s = Slotted()
              for _ in range(n): s.b = s.b + 0.5
          def write_both(n):
              p = Plain(); s = Slotted()
              for _ in range(n):
                  p.b = p.b + 0.5
                  s.b = s.b + 0.5
          def tick_plain(n):
              p = Plain(); total = 0
              for _ in range(n): total += p.tick()
              return total
          def tick_slot(n):
              s = Slotted(); total = 0
              for _ in range(n): total += s.tick()
              return total
          def tick_both(n):
              p = Plain(); s = Slotted(); total = 0
              for _ in range(n): total += p.tick() + s.tick()
              return total
          def cmp_str(n):
              p = Plain(); s = Slotted(); total = 0
              for _ in range(n):
                  if p.c == s.c: total += 1
              return total
          def whole(n):
              p = Plain(); s = Slotted(); total = 0
              for _ in range(n):
                  total += p.a + s.a
                  p.b = p.b + 0.5
                  s.b = s.b + 0.5
                  total += p.tick() + s.tick()
                  if p.c == s.c:
                      total += 1
              return total
          def no_cmp(n):
              p = Plain(); s = Slotted(); total = 0
              for _ in range(n):
                  total += p.a + s.a
                  p.b = p.b + 0.5
                  s.b = s.b + 0.5
                  total += p.tick() + s.tick()
              return total
          def no_ticks(n):
              p = Plain(); s = Slotted(); total = 0
              for _ in range(n):
                  total += p.a + s.a
                  p.b = p.b + 0.5
                  s.b = s.b + 0.5
                  if p.c == s.c:
                      total += 1
              return total
          n = int(sys.argv[2])
          for op in sys.argv[1].split(","):
              f = globals()[op]
              t0 = time.perf_counter_ns(); f(n); t1 = time.perf_counter_ns()
              print("%s %d" % (op, t1 - t0))
          EOF
          cat > timeit.py <<'EOF'
          import os, subprocess, sys, statistics
          bins = ["5db22e15", "be83162d", "4369a2c9", "head"]
          ops = "read_plain,read_slot,read_both,write_plain,write_slot,write_both,tick_plain,tick_slot,tick_both,cmp_str,no_cmp,no_ticks,whole"
          def run(b, env_extra):
              env = dict(os.environ, PYTHONHASHSEED="0", **env_extra)
              out = {}
              r = subprocess.run(["bins/" + b, "attrops.py", ops, "400000"], capture_output=True, text=True, env=env)
              for line in r.stdout.split("\n"):
                  if line.strip():
                      op, ns = line.split(); out[op] = int(ns)
              r = subprocess.run(["bins/" + b, "crates/weavepy-bench/fixtures/attr_access.py"], capture_output=True, text=True,
                                 env=dict(env, WEAVEPY_BENCH_WORK="200000"))
              out["fixture"] = int(r.stdout.strip().split("=")[1])
              return out
          for label, extra in (("default", {}), ("tier 2 off", {"WEAVEPY_TIER2": "0"}), ("synchronous compiles", {"WEAVEPY_FRAME_JIT_SYNC": "1"})):
              samples = {b: {} for b in bins}
              for rnd in range(9):
                  order = bins if rnd % 2 == 0 else bins[::-1]
                  for b in order:
                      for op, ns in run(b, extra).items():
                          samples[b].setdefault(op, []).append(ns)
              print("## %s (median ms; ratio to 5db22e15)" % label)
              names = ["fixture"] + ops.split(",")
              print("| op | " + " | ".join(bins) + " |")
              print("|---|" + "---|" * len(bins))
              for op in names:
                  base = statistics.median(samples[bins[0]].get(op, [0])) or 1
                  cells = []
                  for b in bins:
                      v = samples[b].get(op)
                      cells.append("%.2f (%.2f)" % (statistics.median(v) / 1e6, statistics.median(v) / base) if v else "n/a")
                  print("| %s | %s |" % (op, " | ".join(cells)))
              print(flush=True)
          EOF
          python3 timeit.py | tee attr-bisect.md
          cat attr-bisect.md >> "$GITHUB_STEP_SUMMARY"
