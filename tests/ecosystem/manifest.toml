[packages.lxml.selftest]
mode = "installed"
source = "lxml==6.1.2"
overlay = "src/lxml/tests -> lxml/tests"
requirements = "pytest==8.4.2"
command = "--pyargs lxml.tests"
timeout_seconds = 7200

