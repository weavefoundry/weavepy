[package]
name = "weavepy-cli"
description = "Command-line entry point for the WeavePy interpreter (the `weavepy` binary)."
# Two [[bin]] targets live here (`weavepy` + the `_testembed` twin), so
# a bare `cargo run -p weavepy-cli` needs the tie broken.
default-run = "weavepy"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[lib]
name = "weavepy_cli"
path = "src/lib.rs"

[[bin]]
name = "weavepy"
path = "src/main.rs"

# RFC 0075 WS6 — the `_testembed` twin (CPython's Programs/_testembed):
# the command-driven embedding exerciser `Lib/test/test_embed.py`
# spawns. Auto-named from `src/bin/_testembed.rs`; the regrtest
# harness stages it at `{bindir}/Programs/_testembed`, the path the
# vendored test derives from `sys.executable`.
[[bin]]
name = "_testembed"
path = "src/bin/_testembed.rs"

[dependencies]
weavepy            = { workspace = true }
weavepy-vm         = { workspace = true }
weavepy-parser     = { workspace = true }
weavepy-compiler   = { workspace = true }
weavepy-conformance = { workspace = true }
libc               = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
serde_json         = { workspace = true }
rustyline          = { workspace = true }
dirs               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# RFC 0064 WS1 — the Windows `weavepy.exe` is a thin shim that
# locates and loads `python313.dll` (built from `weavepy-pylib`) at
# startup; the shim's only platform dependency is the loader API.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[features]
# RFC 0067 WS3 — the `weavepy` binary ships with the tier-2 JIT on by
# default (runtime opt-out: `WEAVEPY_JIT=0`).
default = ["jit"]
# RFC 0032 — build the `weavepy` binary with the tier-2 JIT compiled in.
jit = ["weavepy/jit", "weavepy-vm/jit"]

[lints]
workspace = true
