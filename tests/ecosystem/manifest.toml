[packages.gevent]
requirements = "gevent"
probe = "probes/gevent_probe.py"
timeout_seconds = 900

# --- infrastructure-native tail (RFC 0072 WS3/WS4) ----------------------------

# uvloop: Cython over bundled libuv, a drop-in asyncio loop. POSIX-only
# upstream (no Windows wheels exist) — status_windows = "skip" in
# expectations by construction.
[packages.uvloop]
requirements = "uvloop"
probe = "probes/uvloop_probe.py"
timeout_seconds = 900

# psycopg v3: pure-Python frontend + the Cython/libpq binary
# implementation, named explicitly (the `psycopg[binary]` extra resolves
# to the same wheel, but the in-tree pip lane installs extras-free
# requirements more reliably). The probe is serverless but proves the C
# extension is the one live (`pq.__impl__ == "binary"`) and drives real
# libpq to a connection-refused OperationalError.
[packages.psycopg]
requirements = "psycopg psycopg-binary"
probe = "probes/psycopg_probe.py"
timeout_seconds = 900

# grpcio (stretch, measured whatever its color): the C++ core +
# Cython bindings; generic bytes handlers keep protobuf out of the
# probe.
[packages.grpcio]
requirements = "grpcio"
probe = "probes/grpcio_probe.py"
timeout_seconds = 900

# --- ecosystem wave 5 (RFC 0075 WS9) -----------------------------------------

# scikit-learn: the first row exercising loky's spawn-with-memmap
# process model. The probe fits LogisticRegression, runs
# RandomForestClassifier with n_jobs=2 (the loky process pool),
# GridSearchCV over a pipeline, and a joblib.Memory cache round-trip.
[packages.scikit_learn]
requirements = "scikit-learn"
probe = "probes/scikit_learn_probe.py"
timeout_seconds = 1200

# gunicorn -k gevent capstone: launches `gunicorn --workers 2 -k
# gevent` serving a Django WSGI app under the scratch venv's WeavePy,
# drives concurrent requests through the patched-socket path, SIGTERMs
# the master, and asserts worker responses + clean shutdown. Rides the
# pre-fork master → os.fork → monkey.patch_all-in-child surfaces plus
# pwd/grp and the fd leg of os.utime (worker heartbeat).
[packages.gunicorn_gevent]
requirements = "gunicorn gevent django"
probe = "probes/gunicorn_gevent_probe.py"
timeout_seconds = 900

# --- ecosystem wave 6 (RFC 0076 WS5) -----------------------------------------

# polars: the matrix's first large PyO3/abi3 Rust-native consumer —
# the Rust analogue of what grpcio was for C++. The probe drives the
# stable ABI hard: DataFrame construction, group_by().agg(), lazy
# collect(), join, parquet round-trip (abi3 buffer + PyBytes), and
# map_elements with a Python callable (the Rust→Python re-entry leg).
[packages.polars]
requirements = "polars"
probe = "probes/polars_probe.py"
timeout_seconds = 900

# psycopg2: the RFC 0072 deferral, closed. The classic C extension
# over libpq, forced through pip's sdist path (a real pg_config-
# configured C compile — the RFC 0062 no_binary lane). Serverless
# probe like the psycopg v3 row.
[packages.psycopg2]
requirements = "setuptools psycopg2==2.9.12"
no_binary = "psycopg2"
probe = "probes/psycopg2_probe.py"
timeout_seconds = 900

# celery: task round-trip over the in-process memory:// transport +
# cache+memory:// result backend, with a real worker (--pool=solo)
# started in a thread. Pure-Python but concurrency-shaped: kombu's
# event loop, billiard's shims, vine promises.
[packages.celery]
requirements = "celery"
probe = "probes/celery_probe.py"
timeout_seconds = 900

# uvicorn: the deployment twin of the gunicorn-gevent capstone —
# a real `python -m uvicorn` process serving the FastAPI app shape
# people actually deploy (h11 protocol stack), driven concurrently
# over loopback, SIGTERMed, and asserted to exit clean.
[packages.uvicorn]
requirements = "uvicorn fastapi"
probe = "probes/uvicorn_probe.py"
timeout_seconds = 900

# alembic: init + autogenerate (twice — create-table and add-column
# diffs) + upgrade head + downgrade -1 against a sqlalchemy model
# over sqlite, asserting schema and data each step. Exercises the
# migration-script compile+exec path end to end.
[packages.alembic]
requirements = "alembic sqlalchemy"
probe = "probes/alembic_probe.py"
timeout_seconds = 900

# torch (CPU) capstone: the heaviest wheel on PyPI (~70 MB macOS
# arm64, ~200 MB Linux — the wheel cache's largest entries by far,
# accepted per the RFC 0056 posture). Probe scope per RFC 0076 WS5:
# tensor/matmul vs numpy, autograd backward, a 3-epoch MLP loop with
# monotone loss, state_dict round-trip, DataLoader num_workers=2
# (the multiprocessing leg). torch.compile is out of scope — it
# requires a host toolchain and is gated upstream.
[packages.torch]
# torch pinned (the click row's drift class): the struct.py shim's
# public signatures mirror `_struct`'s text signatures, and
# torch._dynamo's `substitute_in_graph` polyfills verify them at
# import — 2.13.0 names the parameter `format`; a floating resolve
# gave the Linux lane an older wheel whose polyfill names it `fmt`
# and fails the import-time signature check.
requirements = "torch==2.13.0 numpy"
probe = "probes/torch_probe.py"
timeout_seconds = 1800

# --- source-build proof rows (RFC 0062 WS2) ----------------------------------
#
# `no_binary` forces the pinned package through pip's sdist path: the
# harness serves the tarball from a loopback PEP 503 index, so the
# in-tree pip's wheel-missing fallback drives a *real* C compile through
# `_pep517` + setuptools against the installed header tree. The probes
# assert the *compiled* module is the one wired in — a silent
# pure-Python fallback fails the row.

[packages.markupsafe_sdist]
requirements = "setuptools markupsafe==3.0.3"
no_binary = "markupsafe"
probe = "probes/markupsafe_sdist_probe.py"
timeout_seconds = 900

[packages.markupsafe_sdist.selftest]
source = "markupsafe==3.0.3"
requirements = "pytest==8.4.2"
command = "tests"
# Engine gap (measured 2026-08: 78 passed, 1 failed): the compiled
# `_escape_inner` gets a str-*subclass* argument (`str(ReferenceStr)`
# deliberately returns a non-plain str) and the C-ABI bridge fails to
# marshal it as a unicode — "returned NULL without setting an
# exception". Same shell-type residue RFC 0062's future-work section
# tracks; the `_native` leg of the identical test passes.
deselect = ["tests/test_escape.py::test_subclass[markupsafe._speedups]"]

[packages.wrapt_sdist]
requirements = "setuptools wrapt==2.3.0"
no_binary = "wrapt"
probe = "probes/wrapt_sdist_probe.py"
timeout_seconds = 900
