# Pinned (RFC 0066 WS5): the row doubles as the heavy-native selftest
# capstone, so the suite under test must be deterministic.
[packages.numpy]
requirements = "numpy==2.5.2"
probe = "probes/numpy_probe.py"
timeout_seconds = 900

# numpy's sdist cannot be tested unbuilt (its C modules only exist
# post-build, and an extracted source tree in cwd would shadow the
# installed wheel), hence installed mode. Scope: `numpy._core` — the
# C-API/ufunc/dtype heart of the suite; the full-suite attempt is
# recorded in the expectations notes.
[packages.numpy.selftest]
mode = "installed"
requirements = "pytest==8.4.2 hypothesis==6.155.7"
command = "--pyargs numpy._core"
timeout_seconds = 2400

