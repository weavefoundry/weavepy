[package]
name = "weavepy-vm"
description = "Bytecode interpreter and runtime object model for WeavePy."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
weavepy-compiler = { workspace = true }
weavepy-lexer    = { workspace = true }
weavepy-parser   = { workspace = true }
weavepy-version  = { workspace = true }
chrono           = { workspace = true }
indexmap         = { workspace = true }
regex            = { workspace = true }
fancy-regex      = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }

# RFC 0017 — OS interface, networking, subprocess.
mio              = { workspace = true }
socket2          = { workspace = true }
sha2             = { workspace = true }
sha1             = { workspace = true }
sha3             = { workspace = true }
md-5             = { workspace = true }
digest           = { workspace = true }
hmac             = { workspace = true }
blake2b_simd     = { workspace = true }
blake2s_simd     = { workspace = true }
base64           = { workspace = true }
crc32fast        = { workspace = true }
flate2           = { workspace = true }

# RFC 0019 — numerics and serialization.
num-bigint       = { workspace = true }
num-integer      = { workspace = true }
num-traits       = { workspace = true }
num-rational     = { workspace = true }
byteorder        = { workspace = true }
encoding_rs      = { workspace = true }
bzip2            = { workspace = true }
xz2              = { workspace = true }
zstd             = { workspace = true }
zstd-safe        = { workspace = true }
zstd-sys         = { workspace = true }
lzma-sys         = { workspace = true }
rusqlite         = { workspace = true }
rust_decimal     = { workspace = true }
expat-sys        = { workspace = true }

# RFC 0023 — drop-in stdlib parity + HTTPS.
memmap2               = { workspace = true }
memchr                = { workspace = true }
libc                  = { workspace = true }
rustls                = { workspace = true }
rustls-pki-types      = { workspace = true }
pkcs8                 = { workspace = true }
rustls-pemfile        = { workspace = true }
rustls-native-certs   = { workspace = true }
webpki-roots          = { workspace = true }
x509-parser           = { workspace = true }

# RFC 0024 — real OS threads, GIL, cycle GC, weakrefs.
parking_lot           = { workspace = true }
crossbeam-channel     = { workspace = true }
crossbeam-utils       = { workspace = true }

# RFC 0032 — tier-2 Cranelift JIT, behind the (default-off) `jit` feature.
weavepy-jit           = { workspace = true, optional = true }
stacker = "0.1.24"
# RFC 0066 WS4: dedicated native stacks for greenlets (aarch64/x86_64
# switching with guard pages — the same contract as upstream greenlet's
# platform switch files, already audited in the wasmtime ecosystem).
corosensei = "0.3"

# RFC 0063 — the Windows wave: Win32 bindings for the NT-native
# stdlib core. Only present in Windows builds.
[target.'cfg(windows)'.dependencies]
windows-sys           = { workspace = true }

[features]
# RFC 0067 WS3 — the tier-2 JIT ships in the default build. Runtime
# opt-out via `WEAVEPY_JIT=0`; build-time opt-out via
# `--no-default-features` for size-constrained embedders.
default = ["jit"]
# Compile the tier-2 JIT integration (pulls in Cranelift).
jit = ["dep:weavepy-jit"]

[lints]
workspace = true

[build-dependencies]
weavepy-version = { workspace = true }

