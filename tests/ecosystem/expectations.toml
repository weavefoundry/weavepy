# Ecosystem conformance baseline (RFC 0055 WS5; RFC 0062 WS3+WS4).
#
# One row per manifest package. Statuses:
#   pass — venv + install + probe all succeed
#   fail — known divergence; the run reports it as "expected fail" and a
#          flip to pass shows up as an improvement to ratchet
#   skip — do not run (e.g. needs network features we don't emulate yet)
#
# Per-OS overrides (RFC 0062 WS3): `status_macos` / `status_linux` /
# `status_windows` (and matching `reason_*`) replace `status`/`reason`
# on that host OS only. Unknown suffixes are a load error.
#
# Self-test tier (RFC 0062 WS4): rows whose manifest entry carries a
# `[packages.X.selftest]` table are also graded on `selftest_status`
# (default "pass"; same per-OS suffix scheme), reported independently
# of the probe status.
#
# `notes` is free-form context for humans. The runner exits non-zero on
# any status that differs from this file (unless --no-check).
#
# measured_os stamp (RFC 0063 WS7): the top-level list below names the
# OSes (std::env::consts::OS spelling, same as the suffix keys) whose
# rows are *measured* baselines. On a host OS not in the stamp, --check
# still prints the full report and writes results, but unexpected rows
# only emit an advisory NOTE and exit 0 — the gate stays advisory until
# a CI-measured Windows baseline is transplanted into status_windows
# rows and "windows" joins the stamp, flipping the lane to blocking. A
# missing stamp means "all OSes measured" (pre-RFC-0063 behaviour).

measured_os = ["macos", "linux"]

